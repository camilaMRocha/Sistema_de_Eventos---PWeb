<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyEvents - Cadastro de Evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
    <style>
        body {
            background: linear-gradient(135deg, #d94848 0%, #e59b2c 30%, #008282 70%, #ea8394 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .cadastro-card {
            background-color: #f7f3ed;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            max-width: 820px;
            width: 100%;
            padding: 35px 35px;
        }

        .card-header-custom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 25px;
        }

        .card-header-custom h3 {
            font-weight: 700;
            text-decoration: underline;
            color: #1e293b;
            margin: 0;
        }

        .btn-close-custom {
            font-size: 1.5rem;
            color: #000000;
            text-decoration: none;
            font-weight: 700;
        }

        .secao-divider {
            text-align: center;
            margin: 25px 0 15px 0;
        }

        .secao-divider span {
            font-weight: 700;
            font-size: 1rem;
            color: #334155;
            border-bottom: 2px solid #64748b;
            padding-bottom: 3px;
            display: inline-block;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.88rem;
            color: #334155;
            margin-bottom: 4px;
        }

        .form-label .required-star {
            color: #dc2626;
        }

        .btn-teal {
            background-color: #008282;
            color: #ffffff;
            font-weight: 600;
            border-radius: 8px;
            padding: 10px 45px;
            border: none;
            transition: background-color 0.2s;
        }

        .btn-teal:hover {
            background-color: #006666;
            color: #ffffff;
        }

        .toggle-btn-group .btn {
            font-size: 0.88rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="cadastro-card">
        <div class="card-header-custom">
            <h3 id="tituloTela">Cadastro de evento</h3>
            <a href="/meus-eventos" class="btn-close-custom" title="Fechar">&times;</a>
        </div>

        <div id="mensagem" class="mb-3"></div>

        <form id="formEvento">
            <!-- Secao: Informacoes basicas -->
            <div class="secao-divider">
                <span>Informações básicas</span>
            </div>

            <div class="row g-3">
                <div class="col-md-6">
                    <label for="nome_evento" class="form-label">Nome do evento <span class="required-star">*</span></label>
                    <input type="text" class="form-control" id="nome_evento" required>
                </div>

                <div class="col-md-6">
                    <label for="tipo_evento_select" class="form-label">Tipo de evento <span class="required-star">*</span></label>
                    <select class="form-select" id="tipo_evento_select" required>
                        <option value="">Selecione o tipo de evento...</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="formato" class="form-label">Formato <span class="required-star">*</span></label>
                    <select class="form-select" id="formato" required>
                        <option value="Presencial">Presencial</option>
                        <option value="Online">Online</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="id_categoria" class="form-label">Categoria <span class="required-star">*</span></label>
                    <select class="form-select" id="id_categoria" required>
                        <option value="">Selecione primeiro o tipo de evento...</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="visibilidade" class="form-label">Visibilidade do evento <span class="required-star">*</span></label>
                    <select class="form-select" id="visibilidade" required>
                        <option value="Privado">Privado</option>
                        <option value="Publico">Público</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="url_imagem" class="form-label">URL da imagem de capa (opcional)</label>
                    <input type="url" class="form-control" id="url_imagem">
                </div>

                <div class="col-md-6">
                    <span class="form-label d-block">Data e horário de início <span class="required-star">*</span></span>
                    <div class="row g-2">
                        <div class="col-7">
                            <label for="data_inicio" class="form-label small text-muted mb-1">Data</label>
                            <input type="date" class="form-control" id="data_inicio" required>
                        </div>
                        <div class="col-5">
                            <label for="hora_inicio" class="form-label small text-muted mb-1">Horário</label>
                            <input type="time" class="form-control" id="hora_inicio" value="19:00" required>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <span class="form-label d-block">Data e horário de término <span class="required-star">*</span></span>
                    <div class="row g-2">
                        <div class="col-7">
                            <label for="data_termino" class="form-label small text-muted mb-1">Data</label>
                            <input type="date" class="form-control" id="data_termino" required>
                        </div>
                        <div class="col-5">
                            <label for="hora_termino" class="form-label small text-muted mb-1">Horário</label>
                            <input type="time" class="form-control" id="hora_termino" value="22:00" required>
                        </div>
                    </div>
                </div>

                <div class="col-12">
                    <label for="descricao_evento" class="form-label">Descrição do evento</label>
                    <textarea class="form-control" id="descricao_evento" rows="3"></textarea>
                </div>
            </div>

            <!-- Secao: Informacoes do local -->
            <div class="secao-divider">
                <span>Informações do local</span>
            </div>

            <div class="text-center mb-3">
                <div class="btn-group toggle-btn-group" role="group">
                    <input type="radio" class="btn-check" name="tipoLocal" id="opcaoDefinirDepois" value="depois" checked>
                    <label class="btn btn-outline-secondary" for="opcaoDefinirDepois">Ainda será definido / Reservar na vitrine</label>

                    <input type="radio" class="btn-check" name="tipoLocal" id="opcaoJaTenhoLocal" value="proprio">
                    <label class="btn btn-outline-secondary" for="opcaoJaTenhoLocal">Já tenho um local próprio</label>
                </div>
            </div>

            <div id="secaoLocalProprio" style="display: none;" class="p-3 bg-white rounded border mb-3">
                <p class="text-muted small mb-3">Informe os dados de endereço do seu local particular:</p>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="local_rua" class="form-label">Rua</label>
                        <input type="text" class="form-control" id="local_rua">
                    </div>
                    <div class="col-md-3">
                        <label for="local_numero" class="form-label">Número</label>
                        <input type="text" class="form-control" id="local_numero">
                    </div>
                    <div class="col-md-3">
                        <label for="local_bairro" class="form-label">Bairro</label>
                        <input type="text" class="form-control" id="local_bairro">
                    </div>
                    <div class="col-md-6">
                        <label for="local_cidade" class="form-label">Cidade</label>
                        <input type="text" class="form-control" id="local_cidade">
                    </div>
                    <div class="col-md-2">
                        <label for="local_estado" class="form-label">UF</label>
                        <input type="text" class="form-control" id="local_estado" maxlength="2">
                    </div>
                    <div class="col-md-4">
                        <label for="local_cep" class="form-label">CEP</label>
                        <input type="text" class="form-control" id="local_cep" placeholder="00000-000">
                    </div>
                </div>
            </div>

            <!-- Secao: Orcamento -->
            <div class="secao-divider">
                <span>Orçamento do evento</span>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-6">
                    <label for="orcamento_estimado" class="form-label">Valor estipulado / Orçamento estimado (R$)</label>
                    <input type="number" step="0.01" min="0" class="form-control text-center fs-5 fw-bold" id="orcamento_estimado" placeholder="0.00">
                </div>
            </div>

            <!-- Botoes de acao -->
            <div class="col-12 mt-4 text-center">
                <button type="submit" class="btn btn-teal" id="btnSubmeter">Cadastrar Evento</button>
                <div class="mt-3">
                    <a href="/meus-eventos" class="small text-secondary text-decoration-none">Cancelar e voltar para meus eventos</a>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/cadastro_evento.js"></script>
</body>
</html>
