<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyEvents - Cadastro de Local</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>
<style>
    body {
            background-image: url("../frontend/imagens/fundo.png");
        }

.logo-circle-mini {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-inner-mini {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #f59e0b;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000;
            font-size: 0.45rem;
            font-weight: 800;
            text-align: center;
            line-height: 1;
        }
        .card-body {
            background-color: #f7f3ed;
            max-width: 1000px;
            width: 100%;
            padding: 35px 35px;
        }

        .card-header-custom {
            background-color: #f7f3ed;
            max-width: 1000px;
            padding: 35px 35px;
        }

        .card-header-custom h5 {
            font-weight: 700;
            text-decoration: underline;
        }

        .btn-close-custom {
            font-size: 1.5rem;
            color: #000000;
            text-decoration: none;
            font-weight: 700;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.88rem;
            color: #334155;
            margin-bottom: 4px;
        }

        .form-label .required-star {
            color: #dc2626;
        }

        .btn-teal {
            background-color: #008282;
            color: #ffffff;
            font-weight: 600;
            border-radius: 8px;
            padding: 7px 45px;
            border: none;
            transition: background-color 0.2s;
        }

        .btn-teal:hover {
            background-color: #006666;
            color: #ffffff;
        }

        .radio-box {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #e2e8f0;
        }
</style>
<body>
    <nav class="navbar navbar-expand-lg bg-white mb-4">
        <div class="container">
            <a href="/" class="d-flex align-items-center text-decoration-none">
                    <div class="logo-circle-mini">
                        <div class="logo-inner-mini">Hey Event</div>
                    </div>
                </a>
            <div class="d-flex align-items-center gap-3 ms-2">
                <a class="nav-link" href="/">Início</a>
                <span class="text-muted">|</span>
                <a class="nav-link" href="/visualizar-locais">Visualizar Locais</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="card">
                    <div class="card-header-custom py-3">
                        <h5 class="mb-0 text-dark" id="tituloCadastroLocal">Cadastro de Novo Espaço / Local para Eventos</h5>
                    </div>
                    <div class="card-body p-4">
                        <div id="mensagem"></div>

                        <form id="formLocal">
                            <div class="row g-3">
                                <div class="col-md-12">
                                    <label for="id_fornecedor" class="form-label">Proprietário / Fornecedor <span class="required-star">*</span></label>
                                    <select class="form-select" id="id_fornecedor" required>
                                        <option value="">Carregando fornecedores...</option>
                                    </select>
                                </div>

                                <div class="col-md-12">
                                    <label for="nome" class="form-label">Nome do Espaço <span class="required-star">*</span></label>
                                    <input type="text" class="form-control" id="nome" placeholder="Ex: Espaço Recanto das Palmeiras" required>
                                </div>

                                <div class="col-md-4">
                                    <label for="capacidade" class="form-label">Capacidade (Pessoas) <span class="required-star">*</span></label>
                                    <input type="number" min="1" class="form-control" id="capacidade" placeholder="Ex: 300" required>
                                </div>

                                <div class="col-md-4">
                                    <label for="preco_diaria" class="form-label">Preço da Diária (R$) <span class="required-star">*</span></label>
                                    <input type="number" step="0.01" min="0" class="form-control" id="preco_diaria" placeholder="0.00" required>
                                </div>

                                <div class="col-md-4">
                                    <label for="metragem" class="form-label">Área Total (m²) <span class="required-star">*</span></label>
                                    <input type="number" step="0.1" min="1" class="form-control" id="metragem" placeholder="Ex: 850" required>
                                </div>

                                <div class="col-md-4">
                                    <label for="quartos" class="form-label">Quartos / Alojamentos</label>
                                    <input type="number" min="0" class="form-control" id="quartos" value="0">
                                </div>

                                <div class="col-md-4">
                                    <label for="banheiros" class="form-label">Banheiros</label>
                                    <input type="number" min="0" class="form-control" id="banheiros" value="0">
                                </div>

                                <div class="col-md-4">
                                    <label for="vagas_estacionamento" class="form-label">Vagas de Estacionamento</label>
                                    <input type="number" min="0" class="form-control" id="vagas_estacionamento" value="0">
                                </div>

                                <div class="col-md-12">
                                    <label for="categorias_select" class="form-label">Categorias Atendidas (Pressione Ctrl para selecionar múltiplas)</label>
                                    <select multiple class="form-select" id="categorias_select" size="4">
                                        <option value="">Carregando categorias...</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="rua" class="form-label">Rua <span class="required-star">*</span></label>
                                    <input type="text" class="form-control" id="rua" required>
                                </div>

                                <div class="col-md-2">
                                    <label for="numero" class="form-label">Número <span class="required-star">*</span></label>
                                    <input type="text" class="form-control" id="numero" required>
                                </div>

                                <div class="col-md-4">
                                    <label for="bairro" class="form-label">Bairro <span class="required-star">*</span></label>
                                    <input type="text" class="form-control" id="bairro" required>
                                </div>

                                <div class="col-md-4">
                                    <label for="cidade" class="form-label">Cidade <span class="required-star">*</span></label>
                                    <input type="text" class="form-control" id="cidade" required>
                                </div>

                                <div class="col-md-2">
                                    <label for="estado" class="form-label">UF (Sigla) <span class="required-star">*</span></label>
                                    <input type="text" class="form-control" id="estado" maxlength="2" placeholder="SP" required>
                                </div>

                                <div class="col-md-3">
                                    <label for="cep" class="form-label">CEP <span class="required-star">*</span></label>
                                    <input type="text" class="form-control" id="cep" placeholder="00000-000" required>
                                </div>

                                <div class="col-md-3">
                                    <label for="complemento" class="form-label">Complemento</label>
                                    <input type="text" class="form-control" id="complemento">
                                </div>

                                <div class="col-md-12">
                                    <label for="descricao" class="form-label">Descrição Completa do Espaço</label>
                                    <textarea class="form-control" id="descricao" rows="3" placeholder="Infraestrutura, regras de uso, acessibilidade, etc."></textarea>
                                </div>

                                <div class="col-12 mt-4 text-end">
                                    <a href="/visualizar-locais" class="btn btn-light me-2">Cancelar</a>
                                    <button type="submit" class="btn btn-teal px-4 me-" id="btnSalvarLocal">Salvar Local</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/local.js"></script>
</body>
</html>
