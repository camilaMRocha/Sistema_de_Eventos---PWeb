<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyEvents - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
    <style>
        body {
            background: linear-gradient(135deg, #d94848 0%, #e59b2c 30%, #008282 70%, #ea8394 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .cadastro-card {
            background-color: #f7f3ed;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            max-width: 780px;
            width: 100%;
            padding: 35px 35px;
        }

        .card-header-custom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 25px;
        }

        .card-header-custom h3 {
            font-weight: 700;
            text-decoration: underline;
            color: #1e293b;
            margin: 0;
        }

        .btn-close-custom {
            font-size: 1.5rem;
            color: #000000;
            text-decoration: none;
            font-weight: 700;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.88rem;
            color: #334155;
            margin-bottom: 4px;
        }

        .form-label .required-star {
            color: #dc2626;
        }

        .btn-teal {
            background-color: #008282;
            color: #ffffff;
            font-weight: 600;
            border-radius: 8px;
            padding: 10px 45px;
            border: none;
            transition: background-color 0.2s;
        }

        .btn-teal:hover {
            background-color: #006666;
            color: #ffffff;
        }

        .radio-box {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="cadastro-card">
        <div class="card-header-custom">
            <h3>Cadastro</h3>
            <a href="/" class="btn-close-custom" title="Fechar">&times;</a>
        </div>

        <div id="mensagem" class="mb-3"></div>

        <form id="formCadastro">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="email" class="form-label">E-mail do usuário <span class="required-star">*</span></label>
                    <input type="email" class="form-control" id="email" placeholder="exemplo@gmail.com" required>
                </div>

                <div class="col-md-6">
                    <label for="nome" class="form-label">Nome completo / Razão Social <span class="required-star">*</span></label>
                    <input type="text" class="form-control" id="nome" required>
                </div>

                <div class="col-md-6">
                    <label for="senha" class="form-label">Senha <span class="required-star">*</span></label>
                    <input type="password" class="form-control" id="senha" placeholder="********" required>
                </div>

                <div class="col-md-6">
                    <label for="confirma_senha" class="form-label">Confirma senha <span class="required-star">*</span></label>
                    <input type="password" class="form-control" id="confirma_senha" placeholder="********" required>
                </div>

                <div class="col-md-6" id="grupoCpf">
                    <label for="cpf" class="form-label">CPF</label>
                    <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00">
                </div>

                <div class="col-md-6">
                    <label for="data_nascimento" class="form-label">Data de nascimento <span class="required-star">*</span></label>
                    <input type="date" class="form-control" id="data_nascimento" required>
                </div>

                <div class="col-md-6">
                    <label for="telefone" class="form-label">Telefone <span class="required-star">*</span></label>
                    <input type="text" class="form-control" id="telefone" placeholder="(00) 00000-0000" required>
                </div>

                <div class="col-md-6">
                    <label for="cidade" class="form-label">Cidade <span class="required-star">*</span></label>
                    <input type="text" class="form-control" id="cidade" required>
                </div>

                <div class="col-md-6">
                    <label for="estado" class="form-label">Estado (UF) <span class="required-star">*</span></label>
                    <input type="text" class="form-control" id="estado" maxlength="2" placeholder="SP" required>
                </div>

                <div class="col-md-6">
                    <label for="rua" class="form-label">Rua</label>
                    <input type="text" class="form-control" id="rua">
                </div>

                <div class="col-md-4">
                    <label for="numero" class="form-label">Número da casa <span class="required-star">*</span></label>
                    <input type="text" class="form-control" id="numero" required>
                </div>

                <div class="col-md-4">
                    <label for="bairro" class="form-label">Bairro</label>
                    <input type="text" class="form-control" id="bairro">
                </div>

                <div class="col-md-4">
                    <label for="cep" class="form-label">CEP <span class="required-star">*</span></label>
                    <input type="text" class="form-control" id="cep" placeholder="00000-000" required>
                </div>

                <div class="col-12 my-2">
                    <div class="radio-box">
                        <label class="form-label d-block mb-2 text-dark">Tipo de perfil na plataforma:</label>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="tipoPerfil" id="perfilCliente" value="Cliente" checked>
                            <label class="form-check-label fw-semibold" for="perfilCliente">
                                Desejo criar eventos (Cliente)
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="tipoPerfil" id="perfilFornecedor" value="Fornecedor">
                            <label class="form-check-label fw-semibold" for="perfilFornecedor">
                                Desejo alugar locais para eventos e/ou oferecer serviços (Fornecedor)
                            </label>
                        </div>
                    </div>
                </div>

                <div id="secaoFornecedorCampos" style="display: none;" class="col-12">
                    <div class="p-3 bg-white rounded border">
                        <h6 class="fw-bold text-secondary mb-3">Informações Adicionais do Fornecedor</h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="cnpj" class="form-label">CNPJ <span class="required-star">*</span></label>
                                <input type="text" class="form-control" id="cnpj" placeholder="00.000.000/0000-00">
                            </div>

                            <div class="col-md-6">
                                <label for="categoria_atuacao" class="form-label">Categoria de Atuação</label>
                                <select class="form-select" id="categoria_atuacao">
                                    <option value="Locacao de Espacos">Locação de Espaços</option>
                                    <option value="Buffet e Gastronomia">Buffet e Gastronomia</option>
                                    <option value="Decoracao e Cenografia">Decoração e Cenografia</option>
                                    <option value="Som e Iluminacao">Som e Iluminação</option>
                                    <option value="Fotografia e Filmagem">Fotografia e Filmagem</option>
                                    <option value="Geral">Serviços Gerais</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="nome_banco" class="form-label">Nome do banco</label>
                                <input type="text" class="form-control" id="nome_banco">
                            </div>

                            <div class="col-md-6">
                                <label for="agencia" class="form-label">Agência</label>
                                <input type="text" class="form-control" id="agencia">
                            </div>

                            <div class="col-md-6">
                                <label for="tipo_conta" class="form-label">Tipo de conta</label>
                                <select class="form-select" id="tipo_conta">
                                    <option value="Corrente">Corrente</option>
                                    <option value="Poupanca">Poupança</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="titular_conta" class="form-label">Titular da conta</label>
                                <input type="text" class="form-control" id="titular_conta">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12 mt-4 text-center">
                    <button type="submit" class="btn btn-teal">Cadastrar</button>
                    <div class="mt-3">
                        <span class="small text-muted">Já possui uma conta?</span>
                        <a href="/login" class="small fw-semibold text-decoration-none">Faça login</a>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/cadastro.js"></script>
</body>
</html>
