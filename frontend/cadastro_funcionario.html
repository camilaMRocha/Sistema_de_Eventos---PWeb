<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyEvents - Cadastro de Funcionário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">HeyEvents</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Início</a>
                <a class="nav-link" href="/visualizar-funcionarios">Visualizar Funcionários</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0 text-dark">Cadastro de Novo Funcionário / Profissional</h5>
                        <a href="/visualizar-funcionarios" class="btn btn-outline-secondary btn-sm">Ver Lista</a>
                    </div>
                    <div class="card-body p-4">
                        <div id="mensagem"></div>

                        <form id="formFuncionario">
                            <div class="row g-3">
                                <div class="col-md-12">
                                    <label for="id_fornecedor" class="form-label">Empresa Fornecedora Vinculada *</label>
                                    <select class="form-select" id="id_fornecedor" required>
                                        <option value="">Carregando fornecedores...</option>
                                    </select>
                                </div>

                                <div class="col-md-12">
                                    <label for="nome_completo" class="form-label">Nome Completo *</label>
                                    <input type="text" class="form-control" id="nome_completo" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="cpf_cnpj" class="form-label">CPF / CNPJ *</label>
                                    <input type="text" class="form-control" id="cpf_cnpj" placeholder="000.000.000-00" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="telefone" class="form-label">Telefone *</label>
                                    <input type="text" class="form-control" id="telefone" placeholder="(00) 00000-0000" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="email" class="form-label">E-mail *</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="funcao_exercida" class="form-label">Função Exercida *</label>
                                    <input type="text" class="form-control" id="funcao_exercida" placeholder="Ex: Coordenador de Buffet, DJ, Fotógrafo" required>
                                </div>

                                <div class="col-md-12">
                                    <label for="descricao_funcao" class="form-label">Descrição das Atividades</label>
                                    <textarea class="form-control" id="descricao_funcao" rows="2" placeholder="Resumo das responsabilidades do profissional"></textarea>
                                </div>

                                <div class="col-md-6">
                                    <label for="data_nascimento" class="form-label">Data de Nascimento</label>
                                    <input type="date" class="form-control" id="data_nascimento">
                                </div>

                                <div class="col-md-4">
                                    <label for="cidade" class="form-label">Cidade</label>
                                    <input type="text" class="form-control" id="cidade">
                                </div>

                                <div class="col-md-2">
                                    <label for="estado" class="form-label">UF</label>
                                    <input type="text" class="form-control" id="estado" maxlength="2" placeholder="SP">
                                </div>

                                <div class="col-12">
                                    <hr class="my-3">
                                    <h6 class="fw-bold text-secondary mb-3">Dados Bancários para Repasse (Opcional)</h6>
                                </div>

                                <div class="col-md-6">
                                    <label for="nome_banco" class="form-label">Banco</label>
                                    <input type="text" class="form-control" id="nome_banco">
                                </div>

                                <div class="col-md-6">
                                    <label for="agencia" class="form-label">Agência</label>
                                    <input type="text" class="form-control" id="agencia">
                                </div>

                                <div class="col-md-6">
                                    <label for="tipo_conta" class="form-label">Tipo de Conta</label>
                                    <select class="form-select" id="tipo_conta">
                                        <option value="">Selecione...</option>
                                        <option value="Corrente">Corrente</option>
                                        <option value="Poupanca">Poupança</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="titular_conta" class="form-label">Titular da Conta</label>
                                    <input type="text" class="form-control" id="titular_conta">
                                </div>

                                <div class="col-12 mt-4 text-end">
                                    <a href="/" class="btn btn-light me-2">Cancelar</a>
                                    <button type="submit" class="btn btn-primary px-4">Salvar Funcionário</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/funcionario.js"></script>
</body>
</html>
