<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyEvents - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
    <style>
        body {
            background: linear-gradient(135deg, #d94848 0%, #e59b2c 30%, #008282 70%, #ea8394 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background-color: #f7f3ed;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            max-width: 440px;
            width: 100%;
            padding: 35px 30px;
            text-align: center;
        }

        .logo-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            position: relative;
        }

        .logo-inner {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #f59e0b;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000;
            font-size: 0.75rem;
            font-weight: 800;
            text-align: center;
            line-height: 1.1;
        }

        .btn-teal {
            background-color: #008282;
            color: #ffffff;
            font-weight: 600;
            border-radius: 8px;
            padding: 10px 40px;
            border: none;
            transition: background-color 0.2s;
        }

        .btn-teal:hover {
            background-color: #006666;
            color: #ffffff;
        }

        .helper-links a {
            color: #0284c7;
            text-decoration: underline;
            font-size: 0.85rem;
            font-style: italic;
            display: block;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-circle">
            <div class="logo-inner">Hey Event</div>
        </div>

        <div id="mensagem" class="text-start mb-3"></div>

        <form id="formLogin" class="text-start">
            <div class="mb-3">
                <label for="email" class="form-label text-dark fw-semibold">E-mail do usuário</label>
                <input type="email" class="form-control form-control-lg bg-white" id="email" placeholder="exemplo@gmail.com" required>
            </div>

            <div class="mb-4">
                <label for="senha" class="form-label text-dark fw-semibold">Senha</label>
                <input type="password" class="form-control form-control-lg bg-white" id="senha" placeholder="********" required>
            </div>

            <div class="helper-links text-center mb-4">
                <a href="/cadastro">Ainda não possui uma conta? Cadastre-se</a>
                <a href="#" onclick="alert('Funcionalidade de recuperação de senha em desenvolvimento.'); return false;">Esqueceu a senha? Clique aqui</a>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-teal">Logar</button>
            </div>

            <div class="text-center mt-3">
                <a href="/" class="text-secondary small text-decoration-none">Voltar à página inicial</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/login.js"></script>
</body>
</html>
