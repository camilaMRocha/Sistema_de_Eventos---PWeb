<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyEvents - Lista de Serviços</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">HeyEvents</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Início</a>
                <a class="nav-link" href="/cadastro-de-servico">Novo Serviço</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-dark mb-1">Serviços Cadastrados</h3>
                <p class="text-muted mb-0">Catálogo de serviços oferecidos pelos fornecedores.</p>
            </div>
            <a href="/cadastro-de-servico" class="btn btn-primary">Cadastrar Serviço</a>
        </div>

        <div id="mensagem"></div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome do Serviço</th>
                        <th>Categoria</th>
                        <th>Preço (R$)</th>
                        <th>Fornecedor</th>
                        <th>Profissional Responsável</th>
                    </tr>
                </thead>
                <tbody id="tabelaServicos">
                    <tr>
                        <td colspan="6" class="text-center py-4 text-muted">Carregando dados...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/servico.js"></script>
</body>
</html>
