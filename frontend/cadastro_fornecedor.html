<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyEvents - Cadastro de Fornecedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">HeyEvents</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Início</a>
                <a class="nav-link" href="/visualizar-fornecedores">Visualizar Fornecedores</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0 text-dark">Cadastro de Novo Fornecedor</h5>
                        <a href="/visualizar-fornecedores" class="btn btn-outline-secondary btn-sm">Ver Lista</a>
                    </div>
                    <div class="card-body p-4">
                        <div id="mensagem"></div>

                        <form id="formFornecedor">
                            <div class="row g-3">
                                <div class="col-md-12">
                                    <label for="nome_fornecedor" class="form-label">Nome Fantasia / Razão Social *</label>
                                    <input type="text" class="form-control" id="nome_fornecedor" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="cnpj" class="form-label">CNPJ *</label>
                                    <input type="text" class="form-control" id="cnpj" placeholder="00.000.000/0000-00" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="telefone" class="form-label">Telefone de Contato *</label>
                                    <input type="text" class="form-control" id="telefone" placeholder="(00) 00000-0000" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="categoria_atuacao" class="form-label">Categoria de Atuação *</label>
                                    <select class="form-select" id="categoria_atuacao" required>
                                        <option value="">Selecione...</option>
                                        <option value="Locacao de Espacos">Locação de Espaços</option>
                                        <option value="Buffet e Gastronomia">Buffet e Gastronomia</option>
                                        <option value="Decoracao e Cenografia">Decoração e Cenografia</option>
                                        <option value="Fotografia e Filmagem">Fotografia e Filmagem</option>
                                        <option value="Som e Iluminacao">Som e Iluminação</option>
                                        <option value="Assessoria e Cerimonial">Assessoria e Cerimonial</option>
                                        <option value="Outros Servicos">Outros Serviços</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="data_nascimento_responsavel" class="form-label">Data de Nascimento do Responsável</label>
                                    <input type="date" class="form-control" id="data_nascimento_responsavel">
                                </div>

                                <div class="col-md-6">
                                    <label for="email" class="form-label">E-mail de Acesso *</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="senha" class="form-label">Senha de Acesso *</label>
                                    <input type="password" class="form-control" id="senha" required>
                                </div>

                                <div class="col-md-4">
                                    <label for="cidade" class="form-label">Cidade *</label>
                                    <input type="text" class="form-control" id="cidade" required>
                                </div>

                                <div class="col-md-2">
                                    <label for="estado" class="form-label">UF *</label>
                                    <input type="text" class="form-control" id="estado" maxlength="2" placeholder="SP" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="rua" class="form-label">Rua</label>
                                    <input type="text" class="form-control" id="rua">
                                </div>

                                <div class="col-md-2">
                                    <label for="numero" class="form-label">Número</label>
                                    <input type="text" class="form-control" id="numero">
                                </div>

                                <div class="col-md-4">
                                    <label for="bairro" class="form-label">Bairro</label>
                                    <input type="text" class="form-control" id="bairro">
                                </div>

                                <div class="col-md-6">
                                    <label for="cep" class="form-label">CEP</label>
                                    <input type="text" class="form-control" id="cep" placeholder="00000-000">
                                </div>

                                <div class="col-md-6">
                                    <label for="complemento" class="form-label">Complemento</label>
                                    <input type="text" class="form-control" id="complemento">
                                </div>

                                <div class="col-12">
                                    <hr class="my-3">
                                    <h6 class="fw-bold text-secondary mb-3">Dados Bancários (Opcional)</h6>
                                </div>

                                <div class="col-md-6">
                                    <label for="nome_banco" class="form-label">Banco</label>
                                    <input type="text" class="form-control" id="nome_banco">
                                </div>

                                <div class="col-md-6">
                                    <label for="agencia" class="form-label">Agência</label>
                                    <input type="text" class="form-control" id="agencia">
                                </div>

                                <div class="col-md-6">
                                    <label for="tipo_conta" class="form-label">Tipo de Conta</label>
                                    <select class="form-select" id="tipo_conta">
                                        <option value="">Selecione...</option>
                                        <option value="Corrente">Corrente</option>
                                        <option value="Poupanca">Poupança</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="titular_conta" class="form-label">Titular da Conta</label>
                                    <input type="text" class="form-control" id="titular_conta">
                                </div>

                                <div class="col-12 mt-4 text-end">
                                    <a href="/" class="btn btn-light me-2">Cancelar</a>
                                    <button type="submit" class="btn btn-primary px-4">Salvar Fornecedor</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/fornecedor.js"></script>
</body>
</html>
