<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyEvents - Cadastro de Serviço</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">HeyEvents</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Início</a>
                <a class="nav-link" href="/visualizar-servicos">Visualizar Serviços</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0 text-dark">Cadastro de Novo Serviço</h5>
                        <a href="/visualizar-servicos" class="btn btn-outline-secondary btn-sm">Ver Lista</a>
                    </div>
                    <div class="card-body p-4">
                        <div id="mensagem"></div>

                        <form id="formServico">
                            <div class="row g-3">
                                <div class="col-md-12">
                                    <label for="id_fornecedor" class="form-label">Fornecedor Responsável *</label>
                                    <select class="form-select" id="id_fornecedor" required>
                                        <option value="">Carregando fornecedores...</option>
                                    </select>
                                </div>

                                <div class="col-md-8">
                                    <label for="nome" class="form-label">Nome do Serviço *</label>
                                    <input type="text" class="form-control" id="nome" placeholder="Ex: Buffet Completo para Casamento" required>
                                </div>

                                <div class="col-md-4">
                                    <label for="preco" class="form-label">Preço Base (R$) *</label>
                                    <input type="number" step="0.01" min="0" class="form-control" id="preco" placeholder="0.00" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="categoria" class="form-label">Categoria do Serviço *</label>
                                    <select class="form-select" id="categoria" required>
                                        <option value="">Selecione...</option>
                                        <option value="Buffet">Buffet</option>
                                        <option value="Decoracao">Decoração</option>
                                        <option value="Som e Iluminacao">Som e Iluminação</option>
                                        <option value="Fotografia e Filmagem">Fotografia e Filmagem</option>
                                        <option value="Seguranca">Segurança</option>
                                        <option value="Cerimonial">Cerimonial</option>
                                        <option value="Outro">Outro</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="id_funcionario" class="form-label">Funcionário Responsável (Opcional)</label>
                                    <select class="form-select" id="id_funcionario">
                                        <option value="">Selecione primeiro o fornecedor...</option>
                                    </select>
                                </div>

                                <div class="col-md-12">
                                    <label for="descricao" class="form-label">Descrição do Serviço</label>
                                    <textarea class="form-control" id="descricao" rows="3" placeholder="Detalhes, itens inclusos e condições de atendimento"></textarea>
                                </div>

                                <div class="col-12 mt-4 text-end">
                                    <a href="/" class="btn btn-light me-2">Cancelar</a>
                                    <button type="submit" class="btn btn-primary px-4">Salvar Serviço</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/servico.js"></script>
</body>
</html>
